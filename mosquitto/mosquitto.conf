# =============================================================================
# Mosquitto configuration for the Smart Waste Bin project (Milestone 6)
# -----------------------------------------------------------------------------
# This is a development-friendly broker config. It opens a single MQTT listener
# on the standard port 1883 and allows anonymous connections so that every
# component (producer, consumer, virtual sensors, REST API, GUI, Node-RED and
# Home Assistant) can connect without credentials during development.
#
# For a production deployment you would disable anonymous access and configure
# a password file / TLS. See the commented block at the bottom.
# =============================================================================

# --- Network listener ---------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# Allow clients to connect without a username/password (development only).
allow_anonymous true

# --- Persistence --------------------------------------------------------------
# Retained messages and queued QoS>0 messages survive a broker restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# --- Logging ------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# --- Message limits -----------------------------------------------------------
max_keepalive 120
# 0 = unlimited message size (fine for our small JSON payloads).
message_size_limit 0

# =============================================================================
# PRODUCTION HARDENING (commented out for the lab environment)
# -----------------------------------------------------------------------------
# allow_anonymous false
# password_file /mosquitto/config/passwd
#
# listener 8883 0.0.0.0
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# =============================================================================
