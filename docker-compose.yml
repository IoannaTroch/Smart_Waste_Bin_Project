# =============================================================================
# Smart Waste Bin — full system orchestration (Cloud Edition)
# -----------------------------------------------------------------------------
# The backend talks to the public HiveMQ broker (broker.hivemq.com:1883), so no
# local broker is required.
#
# The producer reads the REAL HC-SR501 PIR and MQ-3 gas sensor over GPIO, so
# this stack is meant to run ON the Raspberry Pi: the producer service is given
# hardware access via `privileged: true` and the `/dev:/dev` mount.
#
# Home Assistant is included as a service, so `docker compose up` starts it and
# `docker compose down` stops it along with everything else. After the first
# start, do the one-time MQTT integration setup in the HA UI (point it at
# broker.hivemq.com:1883) — see README §7.
# =============================================================================

services:

  train:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: smartbin-train
    command: ["python", "src/train_model.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      MODELS_DIR: /app/data
    volumes:
      - smartbin_data:/app/data
    restart: "no"

  # Edge node — real PIR + MQ-3 over GPIO, publishing as bin-01 / pir-01.
  producer:
    build:
      context: .
      dockerfile: pi_edge_node/Dockerfile
    container_name: smartbin-edge-node
    privileged: true
    volumes:
      - /dev:/dev
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: broker.hivemq.com
      MQTT_PORT: "1883"
      BIN_ID: bin-01
      DEVICE_ID: pir-01
      LOCATION: "Lab Room 101 - Kitchen Corner"
    command: ["python", "pi_edge_node/pir_mqtt_producer.py", "--broker", "broker.hivemq.com", "--pin", "17", "--gas-pin", "23", "--bin-id", "bin-02", "--device-id", "node-02", "--min-high", "0.4"]
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: smartbin-consumer
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: broker.hivemq.com
    command: ["python", "src/mqtt_consumer.py", "--broker", "broker.hivemq.com", "--out", "/app/data/motion_events.jsonl"]
    volumes:
      - smartbin_data:/app/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: smartbin-api
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: broker.hivemq.com
      DATA_DIR: /app/data
      MODELS_DIR: /app/models
      API_PORT: "5000"
    command: ["python", "src/api.py"]
    volumes:
      - smartbin_data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  virtual_sensor_rules:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: smartbin-vs-rules
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: broker.hivemq.com
    command:
      [
        "python", "src/virtual_sensor_rules.py",
        "--broker", "broker.hivemq.com",
        "--subscribe-topic", "smartbin/bin-01/pir-01/motion",
        "--publish-topic", "smartbin/bin-01/usage",
        "--bin-id", "bin-01",
        "--ha-discovery"
      ]
    restart: unless-stopped

  virtual_sensor_ml:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: smartbin-vs-ml
    depends_on:
      train:
        condition: service_completed_successfully
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: broker.hivemq.com
      MODEL_PATH: /app/data/busy_predictor.joblib
    command:
      [
        "python", "src/virtual_sensor_ml.py",
        "--broker", "broker.hivemq.com",
        "--model-path", "/app/data/busy_predictor.joblib",
        "--publish-topic", "smartbin/bin-01/prediction",
        "--bin-id", "bin-01",
        "--ha-discovery"
      ]
    volumes:
      - smartbin_data:/app/data
    restart: unless-stopped

  # Home Assistant — dashboard + MQTT entities. Starts with `up`, stops with `down`.
  # host networking is recommended for HA on a Linux host (Raspberry Pi); it puts
  # the UI on http://<host>:8123 and lets HA reach the broker directly.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    volumes:
      - ./home_assistant:/config        # uses your configuration.yaml + dashboard.yaml
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/Athens
    restart: unless-stopped
# Node-RED — low-code flow layer. Editor at http://<host>:1880.
  # FLOWS=flows.json auto-loads ./node_red/flows.json on start.
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    environment:
      TZ: Europe/Athens
      FLOWS: flows.json
    volumes:
      - ./node_red:/data                # your flows.json lives here
    restart: unless-stopped
volumes:
  smartbin_data:
