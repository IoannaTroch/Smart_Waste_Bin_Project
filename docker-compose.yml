# =============================================================================
# Smart Waste Bin — full system orchestration (Cloud Edition)
# -----------------------------------------------------------------------------
# Backend uses the public HiveMQ broker (broker.hivemq.com:1883). The producer
# reads the REAL PIR + MQ-3 over GPIO, so it runs on the Pi with privileged +
# /dev. Everything is aligned to ONE identity: bin-01 / pir-01 (matches the
# Home Assistant config, the JSON-LD models, and the virtual-sensor defaults).
#
# Node-RED is NOT a service here on purpose: you run it natively on the Pi
# (http://<host>:1880) with your gas flow. Home Assistant UI: http://<host>:8123
# =============================================================================
services:

  train:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: smartbin-train
    command: ["python", "src/train_model.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      MODELS_DIR: /app/data
    volumes:
      - smartbin_data:/app/data
    restart: "no"

  # Edge node — REAL PIR + MQ-3 over GPIO, publishing as bin-01 / pir-01.
  producer:
    build:
      context: .
      dockerfile: pi_edge_node/Dockerfile
    container_name: smartbin-edge-node
    privileged: true          # allows the container to read the physical GPIO pins
    volumes:
      - /dev:/dev             # expose the GPIO device nodes
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: broker.hivemq.com
      MQTT_PORT: "1883"
      BIN_ID: bin-01
      DEVICE_ID: pir-01
      LOCATION: "Lab Room 101 - Kitchen Corner"
    command:
      [
        "python", "pi_edge_node/pir_mqtt_producer.py",
        "--broker", "broker.hivemq.com", "--port", "1883",
        "--pin", "17", "--gas-pin", "23",
        "--bin-id", "bin-01", "--device-id", "pir-01",
        "--ha-discovery"
      ]
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: smartbin-consumer
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: broker.hivemq.com
    command: ["python", "src/mqtt_consumer.py", "--broker", "broker.hivemq.com", "--out", "/app/data/motion_events.jsonl"]
    volumes:
      - smartbin_data:/app/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: smartbin-api
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: broker.hivemq.com
      DATA_DIR: /app/data
      MODELS_DIR: /app/models
      API_PORT: "5000"
    command: ["python", "src/api.py"]
    volumes:
      - smartbin_data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  virtual_sensor_rules:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: smartbin-vs-rules
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: broker.hivemq.com
    command:
      [
        "python", "src/virtual_sensor_rules.py",
        "--broker", "broker.hivemq.com",
        "--subscribe-topic", "smartbin/bin-01/pir-01/motion",
        "--publish-topic", "smartbin/bin-01/usage",
        "--bin-id", "bin-01",
        "--ha-discovery"
      ]
    restart: unless-stopped

  virtual_sensor_ml:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: smartbin-vs-ml
    depends_on:
      train:
        condition: service_completed_successfully
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: broker.hivemq.com
      MODEL_PATH: /app/data/busy_predictor.joblib
    command:
      [
        "python", "src/virtual_sensor_ml.py",
        "--broker", "broker.hivemq.com",
        "--model-path", "/app/data/busy_predictor.joblib",
        "--publish-topic", "smartbin/bin-01/prediction",
        "--bin-id", "bin-01",
        "--ha-discovery"
      ]
    volumes:
      - smartbin_data:/app/data
    restart: unless-stopped

  # Home Assistant — dashboard + MQTT entities. UI at http://<host>:8123
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    volumes:
      - ./home_assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/Athens
    restart: unless-stopped

volumes:
  smartbin_data:
